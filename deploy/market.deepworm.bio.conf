# Public HTTPS entry for MY Market Radar.
# virtual nginx -> FRP server port 18011 -> local app port 8011
server {
    listen 443 ssl;
    server_name market.deepworm.bio;

    ssl_certificate /etc/letsencrypt/live/deepworm.bio/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/deepworm.bio/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 16m;

    # Public-edge fallback; the app also compresses upstream before the FRP link.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # Public deployment is private: keep account creation and API discovery local-only.
    location = /api/auth/register { return 403; }
    location ~ ^/(docs|redoc|openapi\.json)(/|$) { return 404; }

    # Keep hashed assets buffered; FastAPI supplies their immutable cache header.
    location ^~ /assets/ {
        proxy_pass http://127.0.0.1:18011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering on;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:18011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}

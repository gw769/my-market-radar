# ─────────────────────────────────────────────────────────────
#  MY Market Radar · Docker Compose
#  仅 1 个后端容器（FastAPI 托管前端），SQLite 持久化到命名卷
#  对方无需安装 MySQL/Redis/Python/Node —— 只需 Docker Desktop
# ─────────────────────────────────────────────────────────────
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: my-market-radar:latest
    container_name: my-market-radar
    ports:
      - "127.0.0.1:8011:8000"
    env_file:
      - .env
    environment:
      - DATA_DIR=/app/backend/data
    volumes:
      - marketplace_data:/app/backend/data
    # Chromium can exhaust Docker's tiny default /dev/shm while rendering marketplace search
    # results, which looks like random blank pages / tab crashes to the collector.
    shm_size: "1gb"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  marketplace_data:
